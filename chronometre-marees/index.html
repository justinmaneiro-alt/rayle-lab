<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronomètre et Marées</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .timer {
            text-align: center;
            font-size: 2em;
            margin: 20px 0;
            color: #333;
        }
        .button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chronomètre et Marées</h1>
        <div class="timer" id="timer">00:00</div>
        <button class="button" id="toggleButton">Démarrer</button>
        <table>
            <thead>
                <tr>
                    <th>Heure</th>
                    <th>Hauteur</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>06:30</td>
                    <td>1.2 m</td>
                </tr>
                <tr>
                    <td>12:45</td>
                    <td>3.5 m</td>
                </tr>
                <tr>
                    <td>19:15</td>
                    <td>0.8 m</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        let timerInterval;
        let seconds = 0;
        let isRunning = false;
        const timerElement = document.getElementById('timer');
        const toggleButton = document.getElementById('toggleButton');

        function updateTimer() {
            seconds++;
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        toggleButton.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(timerInterval);
                toggleButton.textContent = 'Démarrer';
            } else {
                timerInterval = setInterval(updateTimer, 1000);
                toggleButton.textContent = 'Arrêter';
            }
            isRunning = !isRunning;
        });
    </script>
</body>
</html>
